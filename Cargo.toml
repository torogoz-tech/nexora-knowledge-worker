[package]
name = "nexora-knowledge-worker"
version = "0.4.0"
edition = "2024"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
base64 = "0.22"
futures-lite = "2"
lapin = { version = "4.12.3", default-features = false, features = ["rustls--ring", "tokio"] }
nexora-database-connections = { git = "https://github.com/torogoz-tech/nexora-job-store.git", rev = "1cedd26f9af3798d3d7475cc3190ac961726f7fe" }
nexora-knowledge-store = { git = "https://github.com/torogoz-tech/nexora-job-store.git", rev = "1cedd26f9af3798d3d7475cc3190ac961726f7fe" }
nexora-platform-contracts = { package = "nexora-platform", git = "https://github.com/torogoz-tech/nexora-platform-contracts.git", tag = "0.4.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
ureq = { version = "3", features = ["json"] }
zeroize = "1"

[dev-dependencies]
serde_json = "1"
